[package]
name = "wiz-app"
version = "4.0.0-beta.1"
description = "Simple desktop app to connect and control WiZ bulbs"
authors = ["MatiasTK"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "wiz_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
if-addrs = "0.13"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
ts-rs = "11"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[[example]]
name = "probe"

[dev-dependencies]
tempfile = "3"

# Smaller exe and installer (https://v2.tauri.app/concept/size/). The app waits on the
# network, not the CPU, so optimizing for size costs nothing noticeable.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
