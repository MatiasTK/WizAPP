[package]
name = "wiz-app"
version = "3.0.0"
description = "Simple desktop app to connect and control WiZ bulbs"
authors = ["MatiasTK"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "wiz_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
if-addrs = "0.13"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
ts-rs = "11"

[[example]]
name = "probe"

[dev-dependencies]
tempfile = "3"
